<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form Biodata Siswa</title>

    <link rel="stylesheet" href="latihan3.css">
</head>
<body>

    <div class="container">

        <div class="header">
            <div class="icon">🎓</div>
            <h1>Form Biodata Siswa</h1>
            <p>Silakan lengkapi data diri Anda dengan benar.</p>
        </div>

        <form action="#" method="post">

            <!-- NIM -->
            <div class="form-group">
                <label for="nim">NIM <span>*</span></label>
                <input
                    type="text"
                    id="nim"
                    name="nim"
                    placeholder="Masukkan NIM"
                    required
                >
            </div>

            <!-- Nama Lengkap -->
            <div class="form-group">
                <label for="nama">Nama Lengkap <span>*</span></label>
                <input
                    type="text"
                    id="nama"
                    name="nama"
                    placeholder="Masukkan nama lengkap"
                    required
                >
            </div>

            <!-- Kelas -->
            <div class="form-group">
                <label for="kelas">Kelas <span>*</span></label>
                <select id="kelas" name="kelas" required>
                    <option value="">-- Pilih Kelas --</option>
                    <option value="X">X</option>
                    <option value="XI">XI</option>
                    <option value="XII">XII</option>
                </select>
            </div>

            <!-- Jurusan -->
            <div class="form-group">
                <label>Jurusan <span>*</span></label>

                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="jurusan" value="AKL" required>
                        <span>AKL</span>
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="jurusan" value="MPLB">
                        <span>MPLB</span>
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="jurusan" value="TJKT">
                        <span>TJKT</span>
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="jurusan" value="TKR">
                        <span>TKR</span>
                    </label>
                </div>
            </div>

            <!-- Tempat dan Tanggal Lahir -->
            <div class="form-group">
                <label>Tempat, Tanggal Lahir <span>*</span></label>

                <div class="birth-group">
                    <input
                        type="text"
                        id="tempat"
                        name="tempat"
                        placeholder="Tempat lahir"
                        required
                    >

                    <input
                        type="date"
                        id="tanggal"
                        name="tanggal"
                        required
                    >
                </div>
            </div>

            <!-- Jenis Kelamin -->
            <div class="form-group">
                <label>Jenis Kelamin <span>*</span></label>

                <div class="radio-group">
                    <label class="radio-option">
                        <input
                            type="radio"
                            id="laki"
                            name="gender"
                            value="Laki-laki"
                            required
                        >
                        <span>Laki-laki</span>
                    </label>

                    <label class="radio-option">
                        <input
                            type="radio"
                            id="perempuan"
                            name="gender"
                            value="Perempuan"
                        >
                        <span>Perempuan</span>
                    </label>
                </div>
            </div>

            <!-- Alamat -->
            <div class="form-group">
                <label for="alamat">Alamat <span>*</span></label>
                <textarea
                    id="alamat"
                    name="alamat"
                    rows="4"
                    placeholder="Masukkan alamat lengkap"
                    required
                ></textarea>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email <span>*</span></label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="contoh@gmail.com"
                    required
                >
            </div>

            <!-- Tombol -->
            <div class="button-group">
                <button type="reset" class="btn-reset">
                    Reset
                </button>

                <button type="submit" class="btn-submit">
                    Kirim Biodata →
                </button>
            </div>

            <p class="footer-text">
                * Wajib diisi sebelum mengirim formulir.
            </p>

        </form>

    </div>

</body>
</html>
